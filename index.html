<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Künstler Name | Offizielle Links</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: #0b0b0b; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 580px; width: 100%; text-align: center; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #7289da; margin-bottom: 15px; object-fit: cover; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }
        p { font-size: 0.95rem; color: #a0a0a0; margin-bottom: 30px; }
        
        /* Die Link-Buttons */
        .link-btn { display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #ffffff; text-decoration: none; padding: 16px; margin-bottom: 16px; border-radius: 12px; font-weight: 600; font-size: 1rem; transition: transform 0.2s, background 0.2s; border: 1px solid #2a2a2a; }
        .link-btn:hover { transform: translateY(-2px); background: #252525; }
        
        /* Discord Spezial-Design */
        .discord-btn { background: #5865F2; border: none; }
        .discord-btn:hover { background: #4752C4; }
        
        .footer { margin-top: auto; font-size: 0.8rem; color: #555555; letter-spacing: 1px; text-transform: uppercase; padding-top: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hier Künstlerbild verlinken oder weglassen -->
        <img class="profile-img" src="profilbild.png" alt="Artist Logo">
        
        <h1>LUMA D. HAZE</h1>
        <p>Neuer Track 'SOUNDCLOUD' jetzt Streamen!</p>

        <!-- DISCORD LINK -->
        <a href="https://discord.gg/SWc5RCsAjQ" target="_blank" class="link-btn discord-btn">Discord</a>

        <!-- WEITERE LINKS -->
        <a href="https://www.youtube.com/@lumadhaze" target="_blank" class="link-btn">YouTube</a>
        <a href="https://soundcloud.com/lumadhaze" target="_blank" class="link-btn">SoundCloud</a>
       
    </div>

    <div class="footer">© SANROSEI</div>

</body>
</html>
